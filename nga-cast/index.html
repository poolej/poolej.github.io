<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NGA Art Cast</title>
    <link rel="stylesheet" href="./gallery.css" />
    <script defer src="./gallery.js"></script>
  </head>
  <body>
    <main class="screen">
      <div class="artwork-frame">
        <img id="artwork" class="artwork" alt="" />
      </div>

      <aside class="caption">
        <div class="caption-content">
          <p class="eyebrow" id="credit"></p>
          <h1 id="title"></h1>
          <p class="medium" id="medium"></p>
          <p class="meta" id="meta"></p>
          <p class="description" id="description"></p>
        </div>
        <div class="caption-controls" aria-label="Slideshow controls">
          <div class="filter-row">
            <button
              id="paintings-button"
              class="control-button filter-button is-active"
              type="button"
              aria-label="Show paintings only"
              title="Paintings only"
            >
              Paintings
            </button>
            <span class="filter-divider" aria-hidden="true">|</span>
            <button
              id="all-art-button"
              class="control-button filter-button"
              type="button"
              aria-label="Show all art"
              title="All art"
            >
              All Art
            </button>
          </div>
          <div class="search-shell">
            <input
              id="artist-search"
              class="artist-search"
              type="text"
              placeholder=""
              aria-label="Filter artworks by artist"
              autocomplete="off"
              spellcheck="false"
            />
            <p id="search-count" class="search-count"></p>
          </div>
          <div class="transport-row">
            <button id="prev-button" class="control-button" type="button" aria-label="Previous artwork">
              &#9664;
            </button>
            <button id="pause-button" class="control-button" type="button" aria-label="Pause slideshow">
              &#10074;&#10074;
            </button>
            <button id="next-button" class="control-button" type="button" aria-label="Next artwork">
              &#9654;
            </button>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
